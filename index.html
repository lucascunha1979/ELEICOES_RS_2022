<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Atlas Eleitoral 2022 · RS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
:root{
  --black:#0C0C0C;--white:#F8F8F6;--red:#C0001A;--red-dim:rgba(192,0,26,.10);
  --g50:#F4F4F2;--g100:#EBEBEA;--g200:#D8D8D6;--g400:#9A9A98;--g600:#585856;--g700:#383836;
  --hh:54px;--lw:272px;--rw:356px;
  --serif:'Playfair Display',Georgia,serif;--sans:'IBM Plex Sans','Helvetica Neue',sans-serif;
  --r:3px;--e:.16s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--white);color:var(--black);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
#hdr{height:var(--hh);background:var(--black);display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:3px solid var(--red);flex-shrink:0;z-index:1000;position:relative}
#logo{font-family:var(--serif);font-size:16px;font-weight:900;color:var(--white);white-space:nowrap;flex-shrink:0;line-height:1;letter-spacing:.3px}
#logo em{color:var(--red);font-style:normal}
#logo sup{font-family:var(--sans);font-size:8px;font-weight:500;color:var(--g400);letter-spacing:2px;text-transform:uppercase;margin-left:3px;vertical-align:middle}
.hdiv{width:1px;height:20px;background:#2A2A2A;flex-shrink:0}
#tabs{display:flex;gap:1px}
.tab{padding:6px 14px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--g400);background:transparent;transition:color var(--e);position:relative}
.tab::after{content:'';position:absolute;bottom:-5px;left:14px;right:14px;height:2px;background:var(--red);transform:scaleX(0);transition:transform var(--e);border-radius:1px}
.tab.on{color:var(--white)}.tab.on::after{transform:scaleX(1)}.tab:hover{color:#ccc}
#filter-pill{display:none;align-items:center;gap:6px;background:#1A1A1A;border:1px solid var(--red);padding:3px 10px 3px 8px;border-radius:20px;font-size:10px;color:var(--white);font-weight:500;white-space:nowrap}
#filter-pill.on{display:flex}
#filter-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#filter-x{color:var(--g400);font-size:13px;padding:0;line-height:1;margin-left:2px}
#filter-x:hover{color:var(--white)}
#hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
#scope{display:flex;align-items:center;gap:7px;color:var(--g400);font-size:10px;white-space:nowrap}
#scope-badge{background:#1C1C1C;border:1px solid #2E2E2E;color:var(--white);padding:3px 10px;border-radius:20px;font-size:10px;letter-spacing:.7px;font-weight:500;transition:all var(--e)}
#scope-badge.on{border-color:var(--red);color:var(--red)}
.hdr-btn{padding:5px 10px;font-size:10px;font-weight:600;color:var(--g400);border:1px solid #2A2A2A;border-radius:var(--r);letter-spacing:.5px;text-transform:uppercase;transition:all var(--e)}
.hdr-btn:hover{color:var(--white);border-color:#555}
#app{display:flex;height:calc(100vh - var(--hh))}
#lp{width:var(--lw);background:var(--white);border-right:1px solid var(--g200);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
#lp::-webkit-scrollbar{width:3px}
#lp::-webkit-scrollbar-thumb{background:var(--g200)}
.ps{padding:12px 14px 10px;border-bottom:1px solid var(--g100)}
.slabel{font-size:8px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--g400);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{padding:5px 9px;font-size:11px;font-weight:500;background:var(--g100);color:var(--g600);border:1px solid var(--g200);border-radius:var(--r);transition:all var(--e);white-space:nowrap;line-height:1;cursor:pointer}
.chip:hover{background:var(--g200);color:var(--black)}
.chip.on{background:var(--black);color:var(--white);border-color:var(--black)}
.chip.vista-btn{border-radius:20px}
.chip.vista-btn.on{background:var(--red);border-color:var(--red)}
#legend-wrap{padding:12px 14px;flex:1;min-height:0}
.leg-title{font-size:8px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--g400);margin-bottom:8px}
#legend-items{display:flex;flex-direction:column;gap:3px}
.li{display:flex;align-items:center;gap:7px;cursor:pointer;border-radius:var(--r);padding:4px 5px;transition:all var(--e)}
.li:hover{background:var(--g50)}
.li-sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.li-nome{font-size:11px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-part{font-size:9px;color:var(--g400)}
.li-r{text-align:right;flex-shrink:0}
.li-pct{font-size:11px;font-weight:700}
.li-abs{font-size:9px;color:var(--g400);margin-top:1px}
#lp-foot{padding:9px 14px;border-top:1px solid var(--g100);font-size:9px;color:var(--g400);line-height:1.6}
#map-wrap{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}
#maplabel{position:absolute;top:10px;left:10px;z-index:500;background:rgba(248,248,246,.96);border:1px solid var(--g200);border-left:3px solid var(--red);padding:7px 11px;border-radius:var(--r);pointer-events:none;backdrop-filter:blur(4px)}
#ml-cargo{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--g400)}
#ml-titulo{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--black);line-height:1.2;margin-top:2px}
#loading{position:absolute;inset:0;background:rgba(248,248,246,.88);display:flex;align-items:center;justify-content:center;z-index:700;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
#loading.on{opacity:1;pointer-events:all}
.spinner{width:28px;height:28px;border:2.5px solid var(--g200);border-top-color:var(--red);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#nota-escala{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:500;background:rgba(12,12,12,.82);color:var(--white);font-size:10px;padding:5px 14px;border-radius:20px;pointer-events:none;backdrop-filter:blur(4px);white-space:nowrap;display:none}
#rp{width:var(--rw);background:var(--white);border-left:1px solid var(--g200);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
#rp::-webkit-scrollbar{width:3px}
#rp::-webkit-scrollbar-thumb{background:var(--g200)}
.rp-hdr{padding:12px 14px 10px;border-bottom:1px solid var(--g100);position:sticky;top:0;background:var(--white);z-index:10;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rp-title{font-family:var(--serif);font-size:15px;font-weight:700;line-height:1.2}
.rp-sub{font-size:10px;color:var(--g400);margin-top:2px}
.back-btn{font-size:10px;font-weight:600;color:var(--red);padding:3px 0;white-space:nowrap;flex-shrink:0}
.back-btn:hover{text-decoration:underline}
.rs{padding:11px 14px;border-bottom:1px solid var(--g100)}
.rs:last-child{border-bottom:none}
.rs-title{font-size:8px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--g400);margin-bottom:9px}
.rs-hint{font-size:8px;font-weight:400;letter-spacing:0;color:var(--g400)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}
.tg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:5px}
.titem{background:var(--g50);border:1px solid var(--g100);border-radius:var(--r);padding:7px 9px}
.ti-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.8px;color:var(--g400);font-weight:600;margin-bottom:2px}
.ti-val{font-family:var(--serif);font-size:14px;font-weight:700;line-height:1}
.ti-sub{font-size:9px;color:var(--g400);margin-top:2px}
.ccard{border:1px solid var(--g200);border-radius:var(--r);padding:8px 10px;margin-bottom:4px;display:grid;grid-template-columns:8px 1fr auto;gap:0 8px;align-items:center;position:relative;overflow:hidden;cursor:pointer;transition:background var(--e),border-color var(--e)}
.ccard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc,var(--g200))}
.ccard:hover{background:var(--g50)}
.ccard.filtered{background:var(--red-dim);border-color:var(--red)}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--g400));flex-shrink:0}
.cinfo{min-width:0}
.cnome{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpart{font-size:9px;color:var(--g400);margin-top:1px}
.cvotos{text-align:right;flex-shrink:0}
.cpct{font-family:var(--serif);font-size:15px;font-weight:700;line-height:1}
.cabs{font-size:9px;color:var(--g400);margin-top:1px}
.cbar-wrap{grid-column:1/-1;height:2px;background:var(--g100);border-radius:1px;margin-top:5px;overflow:hidden}
.cbar{height:100%;border-radius:1px;background:var(--pc,var(--g400));transition:width .4s}
.note{background:var(--g50);border:1px solid var(--g100);border-left:3px solid var(--g200);border-radius:var(--r);padding:6px 10px;font-size:10px;color:var(--g600);line-height:1.5;margin-bottom:8px}
.empty{padding:24px 14px;text-align:center;color:var(--g400);font-size:12px}
.chip-metric.on{background:var(--black);color:var(--white);border-color:var(--black)}
/* BUSCA */
.search-wrap{padding:10px 14px;border-bottom:1px solid var(--g100);position:sticky;top:0;background:var(--white);z-index:11}
.search-box{position:relative}
.search-input{width:100%;padding:7px 32px 7px 10px;font-family:var(--sans);font-size:12px;border:1px solid var(--g200);border-radius:var(--r);outline:none;background:var(--g50);color:var(--black);transition:border var(--e)}
.search-input:focus{border-color:var(--black);background:var(--white)}
.search-input::placeholder{color:var(--g400)}
.search-icon{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--g400);font-size:13px;pointer-events:none}
.sr-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border:1px solid var(--g200);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;max-height:280px;overflow-y:auto;display:none}
.sr-item{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;transition:background var(--e)}
.sr-item:hover{background:var(--g50)}
.sr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sr-info{min-width:0}
.sr-nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-sub{font-size:9px;color:var(--g400)}
.sr-empty{padding:10px;font-size:11px;color:var(--g400);text-align:center}
/* CARD FILTRADO */
.fcard{background:var(--g50);border:1px solid var(--g200);border-left:3px solid var(--fc,var(--red));border-radius:var(--r);padding:10px 12px;margin-bottom:4px}
.fcard-nm{font-weight:700;font-size:13px;line-height:1.2}
.fcard-sub{font-size:10px;color:var(--g400);margin-top:2px}
.fcard-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.fstat{background:var(--white);border:1px solid var(--g100);border-radius:var(--r);padding:5px 7px}
.fstat-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.7px;color:var(--g400);font-weight:600}
.fstat-val{font-family:var(--serif);font-size:13px;font-weight:700;line-height:1.2}
/* TOP TERRITÓRIOS */
.trow{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:var(--r);cursor:pointer;transition:background var(--e)}
.trow:hover{background:var(--g50)}
.trow-rank{font-size:9px;color:var(--g400);width:14px;flex-shrink:0;text-align:right}
.trow-nm{font-size:11px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow-bar-wrap{width:60px;height:4px;background:var(--g100);border-radius:2px;flex-shrink:0}
.trow-bar{height:100%;border-radius:2px;background:var(--tc,var(--red))}
.trow-pct{font-size:10px;font-weight:700;color:var(--black);width:36px;text-align:right;flex-shrink:0}
.trow-abs{font-size:9px;color:var(--g400);width:42px;text-align:right;flex-shrink:0}
.hint-box{margin:12px 0;padding:10px 12px;background:var(--g50);border:1px solid var(--g100);border-radius:var(--r);font-size:11px;color:var(--g600);line-height:1.6;text-align:center}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal-overlay.on{display:flex}
.modal{background:var(--white);border-radius:6px;width:540px;max-width:calc(100vw - 32px);max-height:80vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.modal-hdr{padding:20px 24px 16px;border-bottom:1px solid var(--g100);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--white);z-index:1}
.modal-title{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.2}
.modal-close{color:var(--g400);font-size:20px;line-height:1;flex-shrink:0}
.modal-close:hover{color:var(--black)}
.modal-body{padding:20px 24px 24px}
.modal-body h3{font-family:var(--serif);font-size:14px;font-weight:700;margin:16px 0 6px;color:var(--black)}
.modal-body h3:first-child{margin-top:0}
.modal-body p{font-size:12px;line-height:1.7;color:var(--g600);margin-bottom:10px}
.modal-body ul{margin:0 0 10px 16px}
.modal-body li{font-size:12px;line-height:1.7;color:var(--g600)}
.tag{display:inline-block;background:var(--g100);border:1px solid var(--g200);border-radius:3px;padding:1px 6px;font-size:10px;font-weight:600;color:var(--g600);margin:0 2px}
@media print{
  #hdr,#lp,#rp,#modal-overlay{display:none!important}
  #map-wrap{width:100vw!important;height:70vh!important}
  body{overflow:visible!important}
  html,body{height:auto!important}
  #app{height:auto!important;display:block!important}
  #print-report{display:block!important}
}
#print-report{display:none;padding:24px;font-family:var(--sans)}
.leaflet-container{background:#DCE4EC!important;font-family:var(--sans)!important}
.leaflet-control-zoom{border:1px solid var(--g200)!important;border-radius:var(--r)!important;box-shadow:none!important}
.leaflet-control-zoom a{color:var(--black)!important}
.leaflet-tooltip{background:var(--black)!important;color:var(--white)!important;border:none!important;border-radius:var(--r)!important;padding:7px 11px!important;font-family:var(--sans)!important;font-size:11px!important;line-height:1.6!important;box-shadow:0 3px 10px rgba(0,0,0,.25)!important;pointer-events:none!important}
.leaflet-tooltip-top::before{border-top-color:var(--black)!important}
.leaflet-control-attribution{font-size:9px!important}
</style>
</head>
<body>
<header id="hdr">
  <div id="logo">ATLAS<em>·</em>ELEITORAL <sup>RS 2022</sup></div>
  <div class="hdiv"></div>
  <div id="tabs">
    <button class="tab on" onclick="setTab('candidatos')">Candidatos</button>
    <button class="tab"    onclick="setTab('partidos')">Partidos</button>
  </div>
  <div id="filter-pill">
    <div id="filter-dot"></div>
    <span id="filter-label"></span>
    <button id="filter-x" onclick="clearFilter()">✕</button>
  </div>
  <div id="hdr-right">
    <div id="scope"><span>🗺</span><span id="scope-badge">RIO GRANDE DO SUL</span></div>
    <div class="hdiv"></div>
    <button class="hdr-btn" onclick="showModal('metodo')">Metodologia</button>
    <button class="hdr-btn" onclick="exportPDF()">↓ PDF</button>
  </div>
</header>
<div id="app">
  <aside id="lp">
    <div class="ps"><div class="slabel">Cargo</div><div class="chips" id="cargo-chips"></div></div>
    <div class="ps" id="turno-ps" style="display:none"><div class="slabel">Turno</div><div class="chips" id="turno-chips"></div></div>
    <div class="ps"><div class="slabel">Escala Territorial</div><div class="chips" id="escala-chips"></div></div>
    <div class="ps"><div class="slabel">Visualização</div><div class="chips" id="vista-chips"></div></div>
    <div class="ps" id="grandeza-ps"><div class="slabel">O que mapear</div><div class="chips" id="grandeza-chips"></div></div>
    <div id="legend-wrap">
      <div class="leg-title">Legenda — clique para filtrar</div>
      <div id="legend-items"><div style="font-size:11px;color:var(--g400);padding:4px">Carregando...</div></div>
    </div>
    <div style="flex:1"></div>
    <div id="lp-foot">Fonte: TSE · Eleições Gerais 2022<br>RS · 497 municípios · 27.429 seções</div>
  </aside>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="maplabel"><div id="ml-cargo">DEPUTADO FEDERAL</div><div id="ml-titulo">1º Turno · 2022</div></div>
    <div id="nota-escala"></div>
    <div id="loading"><div class="spinner"></div></div>
  </div>
  <aside id="rp"><div id="rp-content"><div class="empty">Carregando dados...</div></div></aside>
</div>
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="modal-title">Metodologia</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div id="print-report"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const DATA='data', GEO='geo';
const CARGOS_CFG=[
  {slug:'dep_federal', label:'Dep. Federal',  turno:[1],   tipo:'prop'},
  {slug:'dep_estadual',label:'Dep. Estadual', turno:[1],   tipo:'prop'},
  {slug:'senador',     label:'Senador',       turno:[1],   tipo:'maj'},
  {slug:'governador',  label:'Governador',    turno:[1,2], tipo:'maj'},
];
const ESCALAS_CFG=[
  {id:'estado',    label:'RS',       geo:null},
  {id:'reg_inter', label:'Região',   geo:'rs_regioes_inter.geojson'},
  {id:'corede',    label:'COREDE',   geo:'rs_coredes.geojson'},
  {id:'municipio', label:'Município',geo:'rs_municipios.geojson'},
  {id:'distrito',  label:'Distrito', geo:'rs_distritos.geojson'},
  {id:'bairro',    label:'Bairro',   geo:'rs_bairros.geojson'},
];
const PC={
  PT:'#CC0000',PL:'#1E3A7B',PSDB:'#0095DA',MDB:'#D4920A',PP:'#2B5BA8',
  PDT:'#B22222',PSOL:'#6B0DAD',REDE:'#2E8B57',NOVO:'#E8600A',
  'UNIÃO':'#15803D',PSD:'#3B82F6',REPUBLICANOS:'#EA580C','PCdoB':'#9B1C1C',
  SOLIDARIEDADE:'#C47E00',AVANTE:'#7C3AED',PODE:'#06B6D4',PSB:'#FF6F00',
  CIDADANIA:'#00838F',PV:'#16A34A',AGIR:'#65A30D',PTB:'#92400E',
  UP:'#DB2777',PSTU:'#BE123C',PATRIOTA:'#0D9488',PRD:'#0D9488',
};
const cor=p=>{if(!p)return'#6B7280';return PC[String(p).toUpperCase().trim()]||'#6B7280';};
const fv=n=>Math.round(n||0).toLocaleString('pt-BR');
const fn=n=>(n||0).toLocaleString('pt-BR');
const fp=n=>n!=null?(n*100).toFixed(1).replace('.',',')+'%':'—';
const h2r=(h,a)=>{if(!h||h.length<7)return`rgba(100,100,100,${a})`;const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;};
const normNm=s=>(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

// ═══════════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════════
const ST={
  cargo:'dep_federal',turno:1,escala:'municipio',vista:'areas',tab:'candidatos',
  filter:null,filterParty:null,showProp:false,metric:null,
  territory:null,territoryMun:null,
  meta:null,munData:null,secoesData:null,secoesBase:null,
  _cache:{},_sidIdx:{},
  _cdMunToTse:{},_tseToNm:{},
  _lisaCache:null,_adjCache:null,
};
let MAP,GLAYER=null,PLAYER=null,HLAYER=null;

// ═══════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════
async function get(url){
  if(ST._cache[url])return ST._cache[url];
  // Arquivos grandes → tentar versão .gz primeiro
  const grandes=['secoes_','secoes_base'];
  const tentarGz=url.endsWith('.json')&&grandes.some(p=>url.includes(p));
  if(tentarGz){
    try{
      const r=await fetch(url+'.gz');
      if(r.ok){
        const buf=await r.arrayBuffer();
        const txt=pako.ungzip(new Uint8Array(buf),{to:'string'});
        const d=JSON.parse(txt);
        ST._cache[url]=d;
        return d;
      }
    }catch(e){/* fallback para .json abaixo */}
  }
  const r=await fetch(url);
  if(!r.ok)throw new Error(`HTTP ${r.status}: ${url}`);
  const d=await r.json();
  ST._cache[url]=d;
  return d;
}
async function loadMeta(){ST.meta=await get(`${DATA}/meta.json`);}
async function loadSecoesBase(){
  if(ST.secoesBase)return;
  ST.secoesBase=await get(`${DATA}/secoes_base.json`);
  ST._sidIdx={};
  for(const s of ST.secoesBase)ST._sidIdx[s.sid]=s;
}
async function loadMunData(cargo,turno){
  try{
    ST.munData=await get(`${DATA}/mun_${cargo}_t${turno}.json`);
    return ST.munData;
  }catch(e){
    console.warn(`Não encontrado: mun_${cargo}_t${turno}.json`);
    if(turno===2){
      showNota('2º turno não disponível — carregando 1º turno');
      ST.turno=1; if(typeof buildTurnoChips==='function')buildTurnoChips();
      try{ST.munData=await get(`${DATA}/mun_${cargo}_t1.json`);return ST.munData;}
      catch(e2){}
    }
    ST.munData=null;return null;
  }
}
async function loadSecoesData(cargo,turno){ST.secoesData=await get(`${DATA}/secoes_${cargo}_t${turno}.json`);return ST.secoesData;}
async function loadGeo(scale){
  const cfg=ESCALAS_CFG.find(e=>e.id===scale);
  if(!cfg||!cfg.geo)return null;
  const geo=await get(`${GEO}/${cfg.geo}`);
  // Reconstrói meta.municipios do GeoJSON — garante COREDE/Região corretos
  if(scale==='municipio'&&ST.meta){
    const nmToTse={};
    for(const [tse,info]of Object.entries(ST.meta.municipios||{})){
      nmToTse[normNm(info.nm)]=tse;
      ST._tseToNm[tse]=info.nm;
    }
    let mapeados=0;
    for(const f of geo.features){
      const cdMun=String(f.properties.CD_MUN);
      const tse=f.properties.CD_MUNICIPIO
        ? String(f.properties.CD_MUNICIPIO)
        : nmToTse[normNm(f.properties.NM_MUN)];
      if(tse&&cdMun){
        ST._cdMunToTse[cdMun]=tse;
        ST._tseToNm[tse]=f.properties.NM_MUN;
        // Reconstruir meta com dados reais do GeoJSON
        ST.meta.municipios[tse]={
          nm:  f.properties.NM_MUN||''  ,
          cor: f.properties.corede||''  ,
          reg: f.properties.NmRgGInt||'',
          rim: f.properties.NmRgGImd||''
        };
        mapeados++;
      }
    }
    console.log(`GeoJSON→meta: ${mapeados} municípios | COREDEs: ${[...new Set(Object.values(ST.meta.municipios).map(m=>m.cor).filter(Boolean))].length}`);
  }
  return geo;
}
async function loadAdj(){
  if(ST._adjCache)return ST._adjCache;
  ST._adjCache=await get(`${DATA}/adjacencia.json`);
  return ST._adjCache;
}

// ═══════════════════════════════════════════════════════════
// AGREGAÇÃO
// ═══════════════════════════════════════════════════════════
function aggByField(munData,fieldKey){
  const result={};
  for(const [cdStr,mun]of Object.entries(munData.municipios)){
    const meta=ST.meta.municipios[cdStr];
    if(!meta)continue;
    const key=meta[fieldKey];
    if(!key)continue;
    if(!result[key])result[key]={nm:key,elet:0,tot:0,bco:0,nul:0,c:{},p:{}};
    const r=result[key];
    r.elet+=mun.elet;r.tot+=mun.tot;r.bco+=mun.bco;r.nul+=mun.nul;
    for(const [nr,v]of Object.entries(mun.c))r.c[nr]=(r.c[nr]||0)+v;
    for(const [pt,v]of Object.entries(mun.p))r.p[pt]=(r.p[pt]||0)+v;
  }
  return result;
}
function aggSecoesIntraMun(cdMun,field){
  if(!ST.secoesBase||!ST.secoesData)return{};
  const sd=ST.secoesData;
  const sidToIdx={};
  for(let i=0;i<sd.sids.length;i++)sidToIdx[sd.sids[i]]=i;
  const result={};
  const secsMun=ST.secoesBase.filter(s=>s.cd===cdMun&&s[field]);
  for(const sec of secsMun){
    const k=sec[field];
    if(!result[k])result[k]={nm:k,mun:sec.mun,elet:0,tot:0,bco:0,nul:0,c:{},p:{}};
    const r=result[k];
    r.elet+=sec.elet;
    const idx=sidToIdx[sec.sid];
    if(idx!==undefined){r.tot+=sd.tot[idx]||0;r.bco+=sd.bco[idx]||0;r.nul+=sd.nul[idx]||0;}
  }
  for(const [nr,entries]of Object.entries(sd.c||{})){
    for(const [idx,v]of entries){
      const sid=sd.sids[idx];const sec=ST._sidIdx[sid];
      if(!sec||sec.cd!==cdMun||!sec[field])continue;
      const k=sec[field];
      if(result[k])result[k].c[nr]=(result[k].c[nr]||0)+v;
    }
  }
  for(const [pt,entries]of Object.entries(sd.p||{})){
    for(const [idx,v]of entries){
      const sid=sd.sids[idx];const sec=ST._sidIdx[sid];
      if(!sec||sec.cd!==cdMun||!sec[field])continue;
      const k=sec[field];
      if(result[k])result[k].p[pt]=(result[k].p[pt]||0)+v;
    }
  }
  return result;
}
function getAgg(){
  if(!ST.munData)return null;
  const md=ST.munData;
  switch(ST.escala){
    case'estado':{
      const e=md.estado;
      const agg={_RS_:{nm:'Rio Grande do Sul',elet:e.elet,tot:e.tot,bco:e.bco,nul:e.nul,c:{},p:{}}};
      for(const[,mun]of Object.entries(md.municipios)){
        for(const[nr,v]of Object.entries(mun.c))agg._RS_.c[nr]=(agg._RS_.c[nr]||0)+v;
        for(const[pt,v]of Object.entries(mun.p))agg._RS_.p[pt]=(agg._RS_.p[pt]||0)+v;
      }
      return agg;
    }
    case'corede':   return aggByField(md,'cor');
    case'reg_inter':return aggByField(md,'reg');
    case'municipio':{const agg={};for(const[cd,mun]of Object.entries(md.municipios))agg[cd]={...mun};return agg;}
    case'distrito':case'bairro':{
      if(!ST.territoryMun)return null;
      return aggSecoesIntraMun(ST.territoryMun,ST.escala==='distrito'?'dist':'bairro');
    }
    default:return null;
  }
}
// Helper robusto: tenta string e número como chave
function getVotesFromItem(item,type,value){
  if(!item)return 0;
  const src=type==='cand'?(item.c||{}):(item.p||{});
  return src[String(value)]||src[value]||0;
}
function getWinner(item){
  const src=ST.tab==='candidatos'?item.c:item.p;
  if(!src||!Object.keys(src).length)return{key:null,cor:'#ccc',pct:0,nome:'—'};
  let maxK=null,maxV=0;
  for(const[k,v]of Object.entries(src)){if(v>maxV){maxV=v;maxK=k;}}
  if(!maxK)return{key:null,cor:'#ccc',pct:0,nome:'—'};
  const nom=(ST.munData?.candidatos||[]).find(c=>String(c.nr)===String(maxK));
  const nome=ST.tab==='candidatos'?(nom?.nm||maxK):maxK;
  const c=ST.tab==='candidatos'?(nom?.cor||cor(nom?.pt)):cor(maxK);
  const total=ST.tab==='candidatos'?(item.tot-item.bco-item.nul):item.tot;
  const pct=total>0?maxV/total:0;
  return{key:maxK,cor:c,pct,nome};
}
function getScalarValue(item){
  // Retorna o valor a usar para colorir: grandeza OU filtro de candidato
  if(ST.metric) return getMetricValue(item, ST.showProp);
  if(ST.filter) return getFilterValue(item);
  return null;
}

function getScalarColor(){
  if(ST.metric) return getMetricColor();
  if(ST.filter) return ST.filter.cor;
  return '#888';
}

function getFilterValue(item){
  if(!ST.filter||!item)return null;
  const{type,value}=ST.filter;
  const v=getVotesFromItem(item,type,value);
  if(ST.showProp){
    const denom=type==='cand'?(item.tot-item.bco-item.nul):item.tot;
    return denom>0?v/denom:0;
  }
  return v; // totais absolutos — quantis normalizam
}

function initMap(){
  MAP=L.map('map',{center:[-29.5,-53.0],zoom:7,zoomControl:true,attributionControl:false});
  const baseTiles=L.tileLayer('https://{s}.tile.openstreetmap.de/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom:18,minZoom:5,subdomains:'abc'
  }).addTo(MAP);
  baseTiles.on('tileerror',function(e){if(e.tile)e.tile.style.visibility='hidden';});
  L.control.attribution({prefix:'© OSM · CARTO · TSE'}).addTo(MAP);
}
function clearMapLayers(){
  if(GLAYER){MAP.removeLayer(GLAYER);GLAYER=null;}
  if(PLAYER){MAP.removeLayer(PLAYER);PLAYER=null;}
  if(HLAYER){MAP.removeLayer(HLAYER);HLAYER=null;}
}
function quantileBreaks(values,n=5){
  if(!values.length)return[];
  const s=[...values].sort((a,b)=>a-b);
  return Array.from({length:n},(_,i)=>s[Math.floor((i+1)/n*s.length)-1]);
}
function quantileColor(v,breaks,baseColor,minA=0.12,maxA=0.92){
  if(!breaks.length)return h2r(baseColor,0.4);
  const i=breaks.findIndex(b=>v<=b);
  const t=i<0?1:(i/(breaks.length-1));
  return h2r(baseColor,minA+t*(maxA-minA));
}

// Obtém a chave de lookup na agg a partir das propriedades do feature
function featureKey(props){
  switch(ST.escala){
    case'estado':   return'_RS_';
    case'corede':   return props.nome;
    case'reg_inter':return props.nome;
    case'municipio':{
      // Usar CD_MUNICIPIO (TSE) direto se disponível, senão lookup via CD_MUN
      if(props.CD_MUNICIPIO)return String(props.CD_MUNICIPIO);
      return ST._cdMunToTse[String(props.CD_MUN)]||null;
    }
    case'distrito': return props.NM_DIST||props.NM_MUN;
    case'bairro':   return props.NM_BAIRRO||props.NM_MUN;
    default:return null;
  }
}

async function renderChoropleth(){
  let geo=await loadGeo(ST.escala);
  const agg=getAgg();
  if(!agg)return;
  if(ST.escala==='estado'){renderRightPanel(agg);buildLegend(agg);return;}
  if(!geo)return;

  // Para escalas intra-municipais: filtrar GeoJSON e dar zoom no município
  let geoFiltrado = geo;
  let boundsTarget = null;
  if(['distrito','bairro'].includes(ST.escala) && ST.territoryMun){
    const munNome = ST._tseToNm[String(ST.territoryMun)] || '';
    const munNomeNorm = normNm(munNome);
    const featsFiltrados = geo.features.filter(f => {
      const fnm = normNm(f.properties.NM_MUN || '');
      return fnm === munNomeNorm;
    });
    if(featsFiltrados.length > 0){
      geoFiltrado = {...geo, features: featsFiltrados};
      // Calcular bounds do município para zoom automático
      const tmpLayer = L.geoJSON({type:'FeatureCollection',features:featsFiltrados});
      boundsTarget = tmpLayer.getBounds();
    }
  }
  geo = geoFiltrado;
  // Calcular breaks para grandeza OU filtro
  const useQuantile=ST.metric||ST.filter;
  const quantileCor=ST.metric?getMetricColor():(ST.filter?.cor||'#888');
  const vals=[];
  if(useQuantile){
    for(const item of Object.values(agg)){
      const v=ST.metric?getMetricValue(item,ST.showProp):getFilterValue(item);
      if(v!=null)vals.push(v);
    }
  }
  const breaks=useQuantile?quantileBreaks(vals):[];
  GLAYER=L.geoJSON(geoFiltrado||geo,{
    style:f=>{
      const k=featureKey(f.properties);
      const item=k?agg[k]:null;
      if(!item)return{fillColor:'#CCC',color:'#FFF',weight:.6,fillOpacity:.2};
      // Grandeza ativa
      if(ST.metric){
        const v=getMetricValue(item,ST.showProp);
        const fc=quantileColor(v,breaks,quantileCor);
        return{fillColor:fc,color:quantileCor,weight:.6,fillOpacity:.85};
      }
      // Filtro de candidato/partido
      if(ST.filter){
        const v=getFilterValue(item);
        const fc=quantileColor(v,breaks,ST.filter.cor);
        return{fillColor:fc,color:v>0?ST.filter.cor:'#FFF',weight:v>0?.8:.4,fillOpacity:v>0?.85:.2};
      }
      // Modo padrão: vencedor
      const w=getWinner(item);
      const op=w.pct<.5?.45:w.pct<.6?.6:w.pct<.72?.75:.9;
      return{fillColor:w.cor,color:'#FFF',weight:.7,fillOpacity:op};
    },
    onEachFeature:(f,layer)=>{
      const k=featureKey(f.properties);
      const item=k?agg[k]:null;
      const nm=item?.nm||f.properties.nome||f.properties.NM_MUN||f.properties.NM_DIST||'—';
      layer.bindTooltip(()=>{
        if(!item)return`<strong>${nm}</strong><br><em>Sem dados</em>`;
        const w=getWinner(item);
        const comp=item.elet>0?item.tot/item.elet:0;
        const fv2=(n,d)=>d>0?fp(n/d):'—';
        let fVal='';
        if(ST.metric){
          const mv=getMetricValue(item,true);
          fVal=fp(mv);
        }else if(ST.filter){
          fVal=fv2(getVotesFromItem(item,ST.filter.type,ST.filter.value),(ST.tab==='candidatos'?(item.tot-item.bco-item.nul):item.tot));
        }
        const metricLabel=ST.metric?(METRICAS.find(m=>m.id===ST.metric)?.label||''):'';
        return`<strong>${nm}</strong><br>
          ${ST.metric?metricLabel+': <strong>'+fVal+'</strong><br>':ST.filter?ST.filter.nome+': <strong>'+fVal+'</strong><br>':'Líder: <strong>'+w.nome+'</strong> · '+fp(w.pct)+'<br>'}
          Comp.: ${fp(comp)} · Eleitores: ${fn(item.elet)}`;
      },{sticky:true,direction:'top'});
      layer.on('mouseover',e=>{if(k!==ST.territory)e.target.setStyle({weight:2,color:'#333'});});
      layer.on('mouseout', e=>{if(k!==ST.territory)GLAYER.resetStyle(e.target);});
      layer.on('click',()=>onFeatureClick(k,nm,f,item));
    }
  }).addTo(MAP);
  renderRightPanel(agg);buildLegend(agg);

  // Zoom automático para escalas intra-municipais
  if(typeof boundsTarget!=='undefined'&&boundsTarget){
    MAP.fitBounds(boundsTarget,{padding:[30,30],maxZoom:13});
  }
}

function onFeatureClick(key,nome,feature,item){
  if(ST.escala==='municipio'){
    // Guardar código TSE (usado para cruzar com secoesBase que usa CD_MUNICIPIO TSE)
    const cdMunIbge=String(feature.properties.CD_MUN);
    const tse=ST._cdMunToTse[cdMunIbge];
    ST.territoryMun=tse?Number(tse):Number(cdMunIbge);
  }
  ST.territory=key;
  // Zoom para o território clicado
  if(GLAYER){
    GLAYER.eachLayer(l=>{
      if(!l.feature)return;
      const k=featureKey(l.feature.properties);
      if(k===key){
        l.setStyle({weight:2.5,color:'#0C0C0C'});
        l.bringToFront();
        try{MAP.fitBounds(l.getBounds(),{padding:[30,30],maxZoom:ST.escala==='municipio'?12:9});}catch(e){}
      }else if(!ST.filter)GLAYER.resetStyle(l);
    });
  }
  updateScopeBadge(nome);
  if(item)renderRightPanelItem(item,nome,key!=='_RS_');
  // Sugerir drill-down para município
  if(ST.escala==='municipio'){
    const hasBairro=ST.secoesBase?.some(s=>s.cd===feature.properties.CD_MUN&&s.bairro);
    if(hasBairro)showNota('Selecione "Bairro" para ver detalhes internos');
    else showNota('Selecione "Distrito" para ver detalhes internos');
  }
}

async function renderPontos(){
  if(!ST.secoesBase)await loadSecoesBase();
  if(!ST.secoesData)await loadSecoesData(ST.cargo,ST.turno);
  const sd=ST.secoesData;const sb=ST.secoesBase;
  if(!sd||!sb)return;

  // Verificar se candidato selecionado está nos dados de seção
  if(ST.filter&&ST.filter.type==='cand'){
    const chave=String(ST.filter.value);
    if(!sd.c||!sd.c[chave]){
      showNota(`"${ST.filter.nome}" não disponível em pontos — mostrando Áreas`);
      ST.vista='areas';buildVistaChips();
      await renderChoropleth();return;
    }
  }
  if(ST.filter&&ST.filter.type==='partido'){
    const algum=Object.keys(sd.p||{}).includes(ST.filter.value);
    if(!algum){
      showNota(`"${ST.filter.nome}" não disponível em pontos — mostrando Áreas`);
      ST.vista='areas';buildVistaChips();
      await renderChoropleth();return;
    }
  }

  // Filtrar seções por município quando escala intra-municipal
  const sbFiltrado = ['distrito','bairro'].includes(ST.escala) && ST.territoryMun
    ? sb.filter(s => s.cd === ST.territoryMun)
    : sb;

  // Zoom automático para escalas intra-municipais
  if(['distrito','bairro'].includes(ST.escala) && ST.territoryMun && sbFiltrado.length > 0){
    const lats = sbFiltrado.map(s=>s.lat);
    const lons = sbFiltrado.map(s=>s.lon);
    const bounds = [[Math.min(...lats)-0.01, Math.min(...lons)-0.01],
                    [Math.max(...lats)+0.01, Math.max(...lons)+0.01]];
    MAP.fitBounds(bounds, {padding:[30,30], maxZoom:13});
  }

  const sidToIdx={};for(let i=0;i<sd.sids.length;i++)sidToIdx[sd.sids[i]]=i;
  const secVals=sbFiltrado.map(sec=>{
    const idx=sidToIdx[sec.sid];
    if(idx===undefined)return 0;
    // Grandeza ativa: calcular com base nos totais da seção
    if(ST.metric){
      const tot=sd.tot[idx]||0;
      const bco=sd.bco[idx]||0;
      const nul=sd.nul[idx]||0;
      const elet=sec.elet||1;
      const abst=elet-tot;
      switch(ST.metric){
        case'comp': return ST.showProp?(tot/elet):tot;
        case'bco':  return ST.showProp?(bco/tot):bco;
        case'nul':  return ST.showProp?(nul/tot):nul;
        case'abst': return ST.showProp?(abst/elet):abst;
      }
    }
    if(!ST.filter)return sd.tot[idx]||0;
    if(ST.filter.type==='cand'){
      for(const[i2,v]of(sd.c[String(ST.filter.value)]||[])){if(i2===idx)return v;}
    }else{
      for(const[i2,v]of(sd.p[ST.filter.value]||[])){if(i2===idx)return v;}
    }
    return 0;
  });
  const nonZero=secVals.filter(v=>v>0).sort((a,b)=>a-b);
  const q=[nonZero[Math.floor(nonZero.length*.25)]||1,nonZero[Math.floor(nonZero.length*.50)]||2,nonZero[Math.floor(nonZero.length*.75)]||3];
  const getR=v=>v<q[0]?3:v<q[1]?5:v<q[2]?8:12;
  const markers=[];
  for(let i=0;i<sbFiltrado.length;i++){
    const sec=sbFiltrado[i];const v=secVals[i];
    if(v<=0&&ST.filter)continue;
    const c=ST.metric?getMetricColor():(ST.filter?ST.filter.cor:'#C0001A');
    const lbl=ST.metric?(METRICAS.find(m=>m.id===ST.metric)?.label||''):(ST.filter?ST.filter.nome:'');
    const vFmt=ST.showProp&&ST.metric?fp(v):fn(v);
    const circle=L.circleMarker([sec.lat,sec.lon],{radius:getR(v),color:c,fillColor:c,weight:.5,fillOpacity:v>0?.75:.2,opacity:v>0?.75:.2});
    circle.bindTooltip(`<strong>${sec.mun}</strong><br>Zona ${sec.sid.split('_')[1]} · Seção ${sec.sid.split('_')[2]}<br>${lbl?lbl+': '+vFmt+'<br>':''}Eleitores: ${fn(sec.elet)}`,{sticky:true,direction:'top'});
    markers.push(circle);
  }
  PLAYER=L.layerGroup(markers).addTo(MAP);
}

async function renderCalor(){
  if(!ST.secoesBase)await loadSecoesBase();
  if(!ST.secoesData)await loadSecoesData(ST.cargo,ST.turno);
  const sd=ST.secoesData;const sb=ST.secoesBase;
  if(!sd||!sb)return;
  const sidToIdx={};for(let i=0;i<sd.sids.length;i++)sidToIdx[sd.sids[i]]=i;
  // Filtrar seções por município quando intra-municipal
  const sbCalor = ['distrito','bairro'].includes(ST.escala) && ST.territoryMun
    ? sb.filter(s => s.cd === ST.territoryMun)
    : sb;

  // Zoom automático
  if(['distrito','bairro'].includes(ST.escala) && ST.territoryMun && sbCalor.length > 0){
    const lats = sbCalor.map(s=>s.lat);
    const lons = sbCalor.map(s=>s.lon);
    MAP.fitBounds([[Math.min(...lats)-0.01,Math.min(...lons)-0.01],
                   [Math.max(...lats)+0.01,Math.max(...lons)+0.01]],
                  {padding:[30,30],maxZoom:13});
  }

  const heatData=[];
  for(const sec of sbCalor){
    const idx=sidToIdx[sec.sid];if(idx===undefined)continue;
    let v=0;
    const tot_s=sd.tot[idx]||0;
    const bco_s=sd.bco?sd.bco[idx]||0:0;
    const nul_s=sd.nul?sd.nul[idx]||0:0;
    const elet_s=sec.elet||1;
    if(ST.metric){
      switch(ST.metric){
        case'comp': v=ST.showProp?(tot_s/elet_s):tot_s; break;
        case'bco':  v=ST.showProp?(bco_s/tot_s):bco_s; break;
        case'nul':  v=ST.showProp?(nul_s/tot_s):nul_s; break;
        case'abst': v=ST.showProp?((elet_s-tot_s)/elet_s):(elet_s-tot_s); break;
      }
    }else if(!ST.filter)v=tot_s;
    else if(ST.filter.type==='cand'){for(const[i2,vv]of(sd.c[String(ST.filter.value)]||[])){if(i2===idx){v=vv;break;}}}
    else{for(const[i2,vv]of(sd.p[ST.filter.value]||[])){if(i2===idx){v=vv;break;}}}
    if(v>0)heatData.push([sec.lat,sec.lon,v]);
  }
  if(typeof L.heatLayer!=='undefined'){
    const maxV=Math.max(...heatData.map(d=>d[2]),1);
    HLAYER=L.heatLayer(heatData.map(d=>[d[0],d[1],d[2]/maxV]),{radius:18,blur:22,maxZoom:12,gradient:{0:'#0000FF',0.4:'#00FFFF',0.6:'#00FF00',0.8:'#FFFF00',1:'#FF0000'}}).addTo(MAP);
  }else{await renderPontos();}
}

// ═══════════════════════════════════════════════════════════
// CLUSTERS LISA
// ═══════════════════════════════════════════════════════════
const LISA_CORES={HH:'#b2182b',LL:'#2166ac',HL:'#ef8a62',LH:'#67a9cf',ns:'#cccccc'};
const LISA_LABELS={HH:'Alto-Alto',LL:'Baixo-Baixo',HL:'Alto-Baixo',LH:'Baixo-Alto',ns:'Não significativo'};

function shuffleCopy(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function computeLISA(ids,valMap,adjMap,nperm=499,alpha=0.05){
  const vals=ids.map(id=>valMap[id]??0);
  const n=vals.length;
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const cen=vals.map(v=>v-mean);
  const vari=cen.reduce((s,v)=>s+v*v,0)/n||1;
  const id2i=Object.fromEntries(ids.map((id,i)=>[String(id),i]));
  const results={};
  for(let i=0;i<n;i++){
    const id=ids[i];
    const nbr=(adjMap[String(id)]||[]).map(nid=>id2i[String(nid)]).filter(j=>j!==undefined&&j!==i);
    if(!nbr.length){results[id]={I:0,p:1,cluster:'ns'};continue;}
    const wlag=nbr.reduce((s,j)=>s+cen[j],0)/nbr.length;
    const Ii=cen[i]*wlag/vari;
    const others=Array.from({length:n},(_,k)=>k).filter(k=>k!==i);
    let ext=0;
    for(let p=0;p<nperm;p++){
      const perm=shuffleCopy(others);
      const wlag_p=perm.slice(0,nbr.length).reduce((s,j)=>s+cen[j],0)/nbr.length;
      if(Math.abs(cen[i]*wlag_p/vari)>=Math.abs(Ii))ext++;
    }
    const pval=(ext+1)/(nperm+1);
    let cluster='ns';
    if(pval<=alpha){
      if(cen[i]>0&&wlag>0)     cluster='HH';
      else if(cen[i]<0&&wlag<0)cluster='LL';
      else if(cen[i]>0&&wlag<0)cluster='HL';
      else                      cluster='LH';
    }
    results[id]={I:Ii,p:pval,cluster};
  }
  return results;
}

async function renderClusters(){
  // LISA só por município
  if(ST.escala!=='municipio'){showNota('Clusters disponíveis apenas na escala Município');await renderChoropleth();return;}
  const geo=await loadGeo('municipio');
  const agg=getAgg();
  if(!geo||!agg)return;
  const adj=await loadAdj();

  // Construir valMap com CD_MUN (chave do adjacencia.json)
  // agg está keyed por TSE code → converter para CD_MUN
  // ST._cdMunToTse = {CD_MUN → TSE}; inverter para TSE → CD_MUN
  const tseTocdMun={};
  for(const[cdMun,tse]of Object.entries(ST._cdMunToTse))tseTocdMun[tse]=cdMun;

  const valMap={};
  for(const[tse,item]of Object.entries(agg)){
    const cdMun=tseTocdMun[tse];
    if(!cdMun)continue;
    let v=0;
    if(!ST.filter)v=item.elet>0?item.tot/item.elet:0;
    else if(ST.filter.type==='cand'){const nom=item.tot-item.bco-item.nul;v=nom>0?(item.c[String(ST.filter.value)]||0)/nom:0;}
    else{v=item.tot>0?(item.p[ST.filter.value]||0)/item.tot:0;}
    valMap[cdMun]=v;
  }

  const ids=Object.keys(valMap);
  showNota('Calculando clusters (499 permutações)...');
  // Yield para não travar UI
  await new Promise(r=>setTimeout(r,10));
  const lisa=computeLISA(ids,valMap,adj,499,0.05);
  ST._lisaCache=lisa;
  document.getElementById('nota-escala').style.display='none';

  const counts={HH:0,LL:0,HL:0,LH:0,ns:0};
  for(const r of Object.values(lisa))counts[r.cluster]++;

  GLAYER=L.geoJSON(geo,{
    style:f=>{
      const cdMun=String(f.properties.CD_MUN);
      const res=lisa[cdMun];
      if(!res)return{fillColor:'#ccc',color:'#fff',weight:.5,fillOpacity:.3};
      return{fillColor:LISA_CORES[res.cluster],color:'#fff',weight:.6,fillOpacity:res.cluster==='ns'?.25:.82};
    },
    onEachFeature:(f,layer)=>{
      const cdMun=String(f.properties.CD_MUN);
      const tse=ST._cdMunToTse[cdMun];
      const res=lisa[cdMun];
      const nm=f.properties.NM_MUN||'—';
      const item=tse?agg[tse]:null;
      const val=valMap[cdMun]??0;
      layer.bindTooltip(()=>`
        <strong>${nm}</strong><br>
        Cluster: <strong style="color:${LISA_CORES[res?.cluster||'ns']}">${LISA_LABELS[res?.cluster||'ns']}</strong><br>
        ${ST.filter?ST.filter.nome+': '+fp(val):'Comparecimento: '+fp(val)}<br>
        I local: ${res?.I?.toFixed(3)||'—'} · p=${res?.p?.toFixed(3)||'—'}
        ${item?'<br>Eleitores: '+fn(item.elet):''}`,
        {sticky:true,direction:'top'});
      layer.on('mouseover',e=>{layer.setStyle({weight:2,color:'#333'});});
      layer.on('mouseout',_=>{GLAYER.resetStyle(layer);});
      layer.on('click',()=>onFeatureClick(tse||cdMun,nm,f,item));
    }
  }).addTo(MAP);

  // Legenda LISA
  const el=document.getElementById('legend-items');
  el.innerHTML=Object.entries(LISA_CORES).map(([k,c])=>`
    <div class="li">
      <div class="li-sw" style="background:${c};opacity:${k==='ns'?.4:1}"></div>
      <div class="li-nome">${LISA_LABELS[k]}</div>
      <div class="li-r"><div class="li-abs">${counts[k]} mun.</div></div>
    </div>`).join('');

  renderRightPanel(agg);

  // Nota metodológica
  const nota=document.createElement('div');
  nota.className='rs';
  nota.innerHTML=`
    <div class="rs-title">Sobre os Clusters</div>
    <div class="note">
      <strong>LISA</strong> (Moran's I Local) com 499 permutações e α=0,05.<br>
      Valor base: ${ST.filter?ST.filter.nome:'Comparecimento'}.<br>
      <strong style="color:${LISA_CORES.HH}">Alto-Alto</strong>: alto rodeado de alto ·
      <strong style="color:${LISA_CORES.LL}">Baixo-Baixo</strong>: baixo rodeado de baixo.<br>
      <strong style="color:${LISA_CORES.HL}">Alto-Baixo</strong> /
      <strong style="color:${LISA_CORES.LH}">Baixo-Alto</strong>: outliers espaciais.
    </div>`;
  document.getElementById('rp-content').appendChild(nota);
}

async function renderMap(){
  clearMapLayers();
  switch(ST.vista){
    case'areas':    await renderChoropleth();break;
    case'pontos':
      if(['estado','reg_inter','corede'].includes(ST.escala)){await renderChoropleth();showNota('Pontos disponíveis para Município, Distrito e Bairro');}
      else{await renderPontos();renderRightPanel(getAgg());buildLegend(getAgg());}
      break;
    case'calor':    await renderCalor();renderRightPanel(getAgg());buildLegend(getAgg());break;
    case'clusters': await renderClusters();break;
  }
  updateMapLabel();
}

function buildSearchList(){
  if(!ST.munData)return[];
  return ST.tab==='candidatos'
    ?(ST.munData.candidatos||[]).map(c=>({type:'cand',value:c.nr,label:c.nm,sub:c.pt,cor:c.cor,v:c.v}))
    :(ST.munData.partidos||[]).map(p=>({type:'partido',value:p.nm,label:p.nm,sub:'',cor:p.cor,v:p.v}));
}

function onSearchInput(q){
  const dd=document.getElementById('sr-dropdown');
  if(!q||q.length<2){dd.style.display='none';return;}
  const norm=q.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  // Se partido selecionado, filtrar candidatos desse partido
  const lista=buildSearchList().filter(i=>{
    if(ST.filterParty&&i.type==='cand'){
      const ci=(ST.munData?.candidatos||[]).find(c=>c.nr===i.value);
      if(ci?.pt!==ST.filterParty.nm)return false;
    }
    return normNm(i.label).includes(norm);
  }).slice(0,10);
  if(!lista.length){dd.innerHTML='<div class="sr-empty">Nenhum resultado</div>';dd.style.display='block';return;}
  dd.innerHTML=lista.map(m=>`
    <div class="sr-item" onclick="selectSearch('${m.type}',${JSON.stringify(String(m.value))},${JSON.stringify(m.cor)},${JSON.stringify(m.label)})">
      <div class="sr-dot" style="background:${m.cor}"></div>
      <div class="sr-info"><div class="sr-nm">${m.label}</div>${m.sub?`<div class="sr-sub">${m.sub}</div>`:''}</div>
      <div style="margin-left:auto;font-size:10px;color:var(--g400)">${fv(m.v)}</div>
    </div>`).join('');
  dd.style.display='block';
}

function selectSearch(type,value,cor,nome){
  const inp=document.getElementById('search-input');
  if(inp)inp.value=nome;
  document.getElementById('sr-dropdown').style.display='none';
  const v=type==='cand'?Number(value):value;
  // Pré-computar vTotal para evitar lookup posterior
  let vTotal=0;
  if(type==='cand'){
    const ci=(ST.munData?.candidatos||[]).find(c=>c.nr===v);
    vTotal=ci?.v||0;
    // Auto-setar filterParty se vindo de candidato
    if(ci?.pt&&!ST.filterParty){
      ST.filterParty={nm:ci.pt,cor:cor(ci.pt)};
    }
  }else{
    const pi=(ST.munData?.partidos||[]).find(p=>p.nm===v);
    vTotal=pi?.v||0;
  }
  // Fallback: se vTotal=0, calcular da soma dos municípios
  if(vTotal===0&&ST.munData?.municipios){
    for(const mun of Object.values(ST.munData.municipios)){
      vTotal+=getVotesFromItem(mun,type,v);
    }
  }
  // Ativar filter com vTotal embutido
  ST.metric=null;buildGrandezaChips();
  ST.filter={type,value:v,cor,nome,vTotal};
  document.getElementById('filter-pill').classList.add('on');
  document.getElementById('filter-dot').style.background=cor;
  document.getElementById('filter-label').textContent=nome;
  renderMap();
}

function selectParty(nm,c){
  ST.filterParty={nm,cor:c};
  // Filtrar mapa por partido
  ST.filter={type:'partido',value:nm,cor:c,nome:nm,vTotal:(ST.munData?.partidos||[]).find(p=>p.nm===nm)?.v||0};
  document.getElementById('filter-pill').classList.add('on');
  document.getElementById('filter-dot').style.background=c;
  document.getElementById('filter-label').textContent=nm;
  // Limpar busca e mostrar candidatos do partido
  const inp=document.getElementById('search-input');
  if(inp){inp.value='';inp.placeholder=`Buscar candidato do ${nm}...`;}
  renderMap();
}

function clearSearch(){
  const inp=document.getElementById('search-input');
  if(inp){inp.value='';inp.placeholder=ST.tab==='candidatos'?'Buscar candidato...':'Buscar partido...';}
  document.getElementById('sr-dropdown').style.display='none';
  ST.filterParty=null;
  clearFilter();
}

    ${ST.filter?topTerritoriosHTML(agg):`<div class="rs"><div class="hint-box">🔍 Busque um candidato ou selecione um partido acima. Clique em uma área do mapa para ver detalhes.</div></div>`}`;
}

function renderRightPanelItem(item,nome,showBack=true){
  const el=document.getElementById('rp-content');
  const cargo_cfg=CARGOS_CFG.find(c=>c.slug===ST.cargo);
  const agg=getAgg();

  // Votos do filtro neste item específico
  let filterItemHTML='';
  if(ST.filter&&item){
    const {type,value,cor,nome:fnome}=ST.filter;
    const v=type==='cand'?(item.c?.[String(value)]||0):(item.p?.[value]||0);
    const denom=type==='cand'?((item.tot||0)-(item.bco||0)-(item.nul||0)):(item.tot||0);
    const pct=denom>0?v/denom:0;
    filterItemHTML=`<div class="rs">
      <div class="rs-title">${fnome} nesta área</div>
      <div class="fcard" style="--fc:${cor}">
        <div class="fcard-stats">
          <div class="fstat"><div class="fstat-lbl">Votos</div><div class="fstat-val">${fv(v)}</div></div>
          <div class="fstat"><div class="fstat-lbl">% Válidos</div><div class="fstat-val">${fp(pct)}</div></div>
        </div>
      </div>
    </div>`;
  }

  el.innerHTML=`
    <div class="rp-hdr">
      <div><div class="rp-title">${nome}</div>
      <div class="rp-sub">${cargo_cfg?.label||''} · ${ST.turno}º Turno · 2022</div></div>
      ${showBack?`<button class="back-btn" onclick="clearTerritory()">← RS</button>`:''}
    </div>
    ${searchHTML()}
    ${filterItemHTML}
    ${item?statsHTML(item):''}
    ${ST.filter&&agg?topTerritoriosHTML(agg):''}`;
}

function renderCards(item){
  // Mantido para compatibilidade — não usado diretamente no novo painel
  // mas pode ser chamado em contextos específicos
  const nom=item.tot-item.bco-item.nul;
  if(ST.tab==='candidatos'){
    const list=ST.munData?.candidatos||[];
    // CORRIDO: item.c pode ser undefined (ex: objeto 'estado') → usar .v da lista
    const getV=nr=>item.c?(item.c[String(nr)]||0):(list.find(c=>c.nr===nr)?.v||0);
    const sorted=[...list].sort((a,b)=>getV(b.nr)-getV(a.nr)).slice(0,20);
    const maxV=Math.max(...sorted.map(c=>getV(c.nr)),1);
    return sorted.map(c=>{
      const v=getV(c.nr);if(v===0)return'';
      const pct=nom>0?v/nom:0;
      const filt=ST.filter?.type==='cand'&&String(ST.filter.value)===String(c.nr);
      return`<div class="ccard ${filt?'filtered':''}" style="--pc:${c.cor}"
        onclick="selectSearch('cand',${c.nr},'${c.cor.replace(/'/g,"\\'")}','${c.nm.replace(/'/g,"\\'")}')">
        <div class="cdot"></div>
        <div class="cinfo"><div class="cnome">${c.nm}</div><div class="cpart">${c.pt}</div></div>
        <div class="cvotos"><div class="cpct">${fp(pct)}</div><div class="cabs">${fv(v)}</div></div>
        <div class="cbar-wrap"><div class="cbar" style="width:${(v/maxV*100).toFixed(1)}%"></div></div>
      </div>`;
    }).join('');
  }else{
    const list=ST.munData?.partidos||[];
    const getV=nm=>item.p?(item.p[nm]||0):(list.find(p=>p.nm===nm)?.v||0);
    const sorted=[...list].sort((a,b)=>getV(b.nm)-getV(a.nm)).slice(0,20);
    const maxV=Math.max(...sorted.map(p=>getV(p.nm)),1);
    return sorted.map(p=>{
      const v=getV(p.nm);if(v===0)return'';
      const pct=item.tot>0?v/item.tot:0;
      const filt=ST.filter?.type==='partido'&&ST.filter.value===p.nm;
      return`<div class="ccard ${filt?'filtered':''}" style="--pc:${p.cor}"
        onclick="selectSearch('partido','${p.nm.replace(/'/g,"\\'")}','${p.cor.replace(/'/g,"\\'")}','${p.nm.replace(/'/g,"\\'")}')">
        <div class="cdot"></div>
        <div class="cinfo"><div class="cnome">${p.nm}</div></div>
        <div class="cvotos"><div class="cpct">${fp(pct)}</div><div class="cabs">${fv(v)}</div></div>
        <div class="cbar-wrap"><div class="cbar" style="width:${(v/maxV*100).toFixed(1)}%"></div></div>
      </div>`;
    }).join('');
  }
}

function buildLegend(agg){
  if(!agg||!ST.munData)return;
  const el=document.getElementById('legend-items');
  if(ST.metric||ST.filter){
    const filterCor=ST.metric?getMetricColor():(ST.filter?.cor||'#888');
    const vals=Object.values(agg).map(item=>ST.metric?getMetricValue(item,ST.showProp):getFilterValue(item)).filter(v=>v!=null);
    const breaks=quantileBreaks(vals);
    const labels=['Muito baixo','Baixo','Médio','Alto','Muito alto'];
    const fmt=b=>ST.showProp?`≤${(b*100).toFixed(1)}%`:`≤${fv(b)}`;
    el.innerHTML=breaks.map((b,i)=>`
      <div class="li">
        <div class="li-sw" style="background:${h2r(filterCor,0.12+i/4*.8)}"></div>
        <div class="li-nome">${labels[i]}</div>
        <div class="li-r"><div class="li-abs">${fmt(b)}</div></div>
      </div>`).join('');
    return;
  }
  const countByKey={};
  for(const item of Object.values(agg)){
    const w=getWinner(item);if(!w.key)continue;
    const lbl=ST.tab==='candidatos'?w.nome:w.key;
    if(!countByKey[lbl])countByKey[lbl]={cor:w.cor,count:0};
    countByKey[lbl].count++;
  }
  el.innerHTML=Object.entries(countByKey)
    .sort((a,b)=>b[1].count-a[1].count).slice(0,5)
    .map(([lbl,info])=>`
      <div class="li">
        <div class="li-sw" style="background:${info.cor}"></div>
        <div class="li-nome">${lbl.length>24?lbl.slice(0,24)+'…':lbl}</div>
        <div class="li-r"><div class="li-abs">${info.count} mun.</div></div>
      </div>`).join('')
    +'<div style="font-size:10px;color:var(--g400);padding:6px 2px">Use a busca ou selecione uma grandeza.</div>';
}

function setShowProp(v){ST.showProp=v;renderMap();}

async function setCargo(slug){
  ST.cargo=slug;const cfg=CARGOS_CFG.find(c=>c.slug===slug);
  ST.turno=cfg.turno[0];clearFilter(false);ST.territory=null;ST.territoryMun=null;
  buildCargoChips();buildTurnoChips();
  document.getElementById('turno-ps').style.display=cfg.turno.length>1?'':'none';
  updateScopeBadge('Rio Grande do Sul');load(true);
  try{ST.munData=null;ST.secoesData=null;await loadMunData(ST.cargo,ST.turno);await renderMap();}
  finally{load(false);}
}
async function setTurno(t){
  ST.turno=t;clearFilter(false);load(true);
  try{ST.munData=null;ST.secoesData=null;await loadMunData(ST.cargo,ST.turno);await renderMap();}
  finally{load(false);}
  buildTurnoChips();
}
async function setEscala(id){
  const intramun=['distrito','bairro'].includes(id);
  if(intramun&&!ST.territoryMun){showNota('Selecione um município no mapa primeiro');return;}
  ST.escala=id;buildEscalaChips();buildVistaChips();clearFilter(false);load(true);

    if(intramun){await loadSecoesBase();await loadSecoesData(ST.cargo,ST.turno);}
    await renderMap();
  }finally{load(false);}
}
function setVista(v){ST.vista=v;buildVistaChips();load(true);renderMap().finally(()=>load(false));}
function toggleFilter(type,value,c,nome){
  if(ST.filter&&ST.filter.type===type&&String(ST.filter.value)===String(value)){clearFilter();return;}
  ST.filter={type,value,cor:c,nome};
  const pill=document.getElementById('filter-pill');
  document.getElementById('filter-dot').style.background=c;
  document.getElementById('filter-label').textContent=nome;
  pill.classList.add('on');renderMap();
}
function clearFilter(rerender=true){
  ST.filter=null;ST.filterParty=null;
  document.getElementById('filter-pill').classList.remove('on');
  const inp=document.getElementById('search-input');
  if(inp)inp.value='';
  if(rerender)renderMap();
}
function clearTerritory(){
  ST.territory=null;ST.territoryMun=null;
  updateScopeBadge('Rio Grande do Sul');
  renderRightPanel(getAgg());
  if(GLAYER)GLAYER.eachLayer(l=>{if(l.feature)GLAYER.resetStyle(l);});

const METRICAS=[
  {id:'comp', label:'Comparecimento', cor:'#1D4ED8'},
  {id:'bco',  label:'Brancos',        cor:'#6B7280'},
  {id:'nul',  label:'Nulos',          cor:'#D97706'},
  {id:'abst', label:'Abstenção',      cor:'#111827'},
];

function buildGrandezaChips(){
  const el=document.getElementById('grandeza-chips');
  if(!el)return;
  el.innerHTML=METRICAS.map(m=>
    `<button class="chip chip-metric ${ST.metric===m.id?'on':''}"
      style="${ST.metric===m.id?'':''}border-left:3px solid ${m.cor}"
      onclick="setMetric('${m.id}')">${m.label}</button>`
  ).join('');
}

function setMetric(id){
  if(ST.metric===id){
    // Desativar — voltar ao modo padrão
    ST.metric=null;
  }else{
    ST.metric=id;
    // Limpar filtro de candidato ao ativar grandeza
    ST.filter=null;
    ST.filterParty=null;
    document.getElementById('filter-pill').classList.remove('on');
    const inp=document.getElementById('search-input');
    if(inp)inp.value='';
  }
  buildGrandezaChips();
  // Forçar re-render removendo camada atual
  if(typeof MAP!=='undefined'&&GLAYER){try{MAP.removeLayer(GLAYER);}catch(e){}GLAYER=null;}
  if(typeof MAP!=='undefined'&&PLAYER){try{MAP.removeLayer(PLAYER);}catch(e){}PLAYER=null;}
  renderMap();
}

function getMetricValue(item, proporcional){
  if(!item)return null;
  const elet=item.elet||1;
  const tot=item.tot||0;
  const abst=elet-tot;
  switch(ST.metric){
    case'comp': return proporcional?(tot/elet)      :tot;
    case'bco':  return proporcional?(item.bco/tot)  :item.bco;
    case'nul':  return proporcional?(item.nul/tot)  :item.nul;
    case'abst': return proporcional?(abst/elet)     :abst;
    default:    return null;
  }
}

function getMetricColor(){
  return METRICAS.find(m=>m.id===ST.metric)?.cor||'#1D4ED8';
}

function buildVistaChips(){
  // Vistas disponíveis por escala
  const VISTA_MAP={
    estado:    ['areas'],
    reg_inter: ['areas','clusters'],
    corede:    ['areas','clusters'],
    municipio: ['areas','pontos','calor','clusters'],
    distrito:  ['areas'],
    bairro:    ['areas'],
  };
  const permitidas=VISTA_MAP[ST.escala]||['areas'];
  // Se vista atual não permitida nesta escala, voltar para áreas
  if(!permitidas.includes(ST.vista)){ST.vista='areas';}
  const todas=[{id:'areas',label:'Áreas'},{id:'pontos',label:'Pontos'},{id:'calor',label:'Calor'},{id:'clusters',label:'Clusters'}];
  document.getElementById('vista-chips').innerHTML=todas
    .filter(v=>permitidas.includes(v.id))
    .map(v=>`<button class="chip vista-btn ${v.id===ST.vista?'on':''}" onclick="setVista('${v.id}')">${v.label}</button>`).join('');
}
function updateMapLabel(){
  const cfg=CARGOS_CFG.find(c=>c.slug===ST.cargo);

  document.getElementById('ml-titulo').textContent=`${ST.turno}º Turno · 2022`;
}

  el.textContent=msg;el.style.display='block';
  setTimeout(()=>el.style.display='none',3500);
